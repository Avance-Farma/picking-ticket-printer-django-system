<nav class="bg-slate-800 text-white flex items-center justify-between px-4 sm:px-6 h-[52px] sticky top-0 z-50 shadow-md">

        <div class="flex items-center gap-1.5 bg-white/10 border border-white/15 rounded-full px-3 py-1 font-medium hidden lg:flex">

            <span id="count-pending">{{ total_pending|default:0 }}</span>&nbsp;pendentes
        </div>
        <div class="w-px h-5 bg-white/20 mx-1 hidden lg:block"></div>
        {% endif %}
        
        <a href="{% url 'orders-list' %}"
            class="flex items-center gap-1.5 {% if request.resolver_match.url_name == 'orders-list' %}bg-white/20{% else %}bg-white/10{% endif %} border border-white/15 rounded-full px-3 py-1 font-medium hover:bg-white/20 transition-colors no-underline text-white">

            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">

            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">

                <path d="M12 20v-5h4v5h5V9l-9-7-9 7v11h5z" />
