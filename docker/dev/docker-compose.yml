services:
  # ─── Redis Message Broker ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"  # Exposed for local dev introspection (e.g., RedisInsight)
    volumes:
      - redis_data:/data
    networks:
      - backend

  # ─── PostgreSQL Database ─────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ../../.env
    ports:
      - "5432:5432"  # Exposed for local dev introspection (e.g., DBeaver)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # ─── Tailwind CSS Watch (Development) ───────────────────────────────────────
  tailwind:
    image: node:22-alpine
    working_dir: /app/theme/static_src
    command: sh -c "npm ci && npm run dev"
    volumes:
      # Mount entire app so Tailwind can watch both source and templates
      - ../../:/app
    networks:
      - frontend

  # ─── Django / Uvicorn (Development) ──────────────────────────────────────
  web:
    build:
      context: ../../
      dockerfile: docker/django/Dockerfile
      target: runtime
      args:
        INSTALL_DEV: "true"
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DJANGO_ENV=development
      - EVOLUTION_API_URL=http://evolution-api:8080
      - EVOLUTION_API_KEY=minha-chave-secreta-123
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      tailwind:
        condition: service_started
    volumes:
      # Mount local code for live-reload
      - ../../:/app
      # Override the mounted .venv with the container's built .venv using an anonymous volume
      - /app/.venv
      - static_volume:/staticfiles
      - media_volume:/media
      - ../../certs:/app/certs:ro
    ports:
      - "8000:8000" # Expose 8000 for direct API testing bypassing nginx if needed
    networks:
      - backend
      - frontend

  # ─── Celery Worker (Development) ─────────────────────────────────────────
  worker:
    build:
      context: ../../
      dockerfile: docker/django/Dockerfile
      target: runtime
      args:
        INSTALL_DEV: "true"
    restart: unless-stopped
    command: watchfiles "celery -A core worker -l info --concurrency=2" .
    env_file:
      - ../../.env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DJANGO_ENV=development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ../../:/app
      - /app/.venv
      - media_volume:/media
    networks:
      - backend

  # ─── Celery Beat (ERP Sync Scheduler — Development) ──────────────────────
  beat:
    build:
      context: ../../
      dockerfile: docker/django/Dockerfile
      target: runtime
      args:
        INSTALL_DEV: "true"
    restart: unless-stopped
    command: celery -A core beat -l info
    env_file:
      - ../../.env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DJANGO_ENV=development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ../../:/app
      - /app/.venv
    networks:
      - backend

  # ─── MkDocs Live Server (Development) ────────────────────────────────────
  docs:
    build:
      context: ../../
      dockerfile: docker/django/Dockerfile
      target: runtime
      args:
        INSTALL_DEV: "true"
    restart: unless-stopped
    command: /bin/sh -c "/app/.venv/bin/mkdocs serve -a 0.0.0.0:8001"
    entrypoint: []
    environment:
      - UV_CACHE_DIR=/tmp/uv_cache
    volumes:
      - ../../:/app
      - /app/.venv
    ports:
      - "8001:8001"
    networks:
      - frontend

  # ─── Nginx Reverse Proxy (Development) ───────────────────────────────────
  nginx:
    build:
      context: ../../
      dockerfile: docker/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - static_volume:/staticfiles:ro
      - media_volume:/media:ro
    depends_on:
      - web
    networks:
      - frontend

  # ─── Evolution API (WhatsApp Local Dev) ──────────────────────────────────
  evolution-api:
    image: atendai/evolution-api:latest
    ports:
      - "8081:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=minha-chave-secreta-123
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${POSTGRES_USER:-avance}:${POSTGRES_PASSWORD:-avance}@db:5432/${POSTGRES_DB:-picking_system}
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_dev
      - REDIS_ENABLED=true
      - REDIS_URI=redis://redis:6379/2
      - WEBHOOK_GLOBAL_ENABLED=true
      # Aponta pro container 'web' na rede interna do docker-compose
      - WEBHOOK_GLOBAL_URL=http://web:8000/whatsapp/api/webhook/
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=false
      - WEBHOOK_EVENTS_APPLICATION_STARTUP=false
      - WEBHOOK_EVENTS_QRCODE_UPDATED=true
      - WEBHOOK_EVENTS_MESSAGES_SET=false
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - WEBHOOK_EVENTS_MESSAGES_UPDATE=false
      - WEBHOOK_EVENTS_MESSAGES_DELETE=false
      - WEBHOOK_EVENTS_SEND_MESSAGE=false
      - WEBHOOK_EVENTS_CONTACTS_SET=false
      - WEBHOOK_EVENTS_CONTACTS_UPSERT=false
      - WEBHOOK_EVENTS_CONTACTS_UPDATE=false
      - WEBHOOK_EVENTS_PRESENCE_UPDATE=false
      - WEBHOOK_EVENTS_CHATS_SET=false
      - WEBHOOK_EVENTS_CHATS_UPSERT=false
      - WEBHOOK_EVENTS_CHATS_UPDATE=false
      - WEBHOOK_EVENTS_CHATS_DELETE=false
      - WEBHOOK_EVENTS_GROUPS_UPSERT=false
      - WEBHOOK_EVENTS_GROUPS_UPDATE=false
      - WEBHOOK_EVENTS_GROUP_PARTICIPANTS_UPDATE=false
      - WEBHOOK_EVENTS_CONNECTION_UPDATE=true
      - WEBHOOK_EVENTS_CALL_OFFER=false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - backend

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

networks:
  backend:
  frontend:
