          description: Timestamp de quando os volumes foram confirmados pelo operador.
        shipped_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Data da Expedição
          description: Timestamp de quando o pedido foi marcado como expedido.
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - confirmed_at
      - customer_name
      - order_number
      - route
      - shipped_at
      - status
      - total_volumes
      - updated_at
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
